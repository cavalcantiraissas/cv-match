services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC: "false"   # "true" para usar Sentence Transformers
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/cv_match.db
    volumes:
      - cv_match_data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cv_match_data:
